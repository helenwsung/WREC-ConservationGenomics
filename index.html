<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Should We Protect?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning activity, calm and clear for a mixed audience
   IDEA a field casebook: each stage is a card handed to the team, lab reports included
   PICTURE estuary band with a crocodile's eyes at the waterline; then the current stage card large
   COLOUR deep estuary teal, white ground, croc-eye gold, sunset coral for what's chosen
   TYPE Rubik 700 display + Nunito Sans text
   LAYOUT slim scene band with title, progress trail, one 820px column per stage; stacks on phones */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a1d1c);--ink:light-dark(#10211f,#e6efed);--soft:light-dark(#4a5d5a,#a9bcb8);--panel:light-dark(#f0f5f3,#12302e);--line:light-dark(#d3e0dc,#24504c);--water:#0f4b49;--deep:#082e2d;--gold:#f2c14e;--accent:light-dark(#d9512f,#ff7a56);--accentbg:light-dark(#fff1ec,#3a1f17);--up:light-dark(#1f7a4d,#6fd3a0);--dn:light-dark(#b23a1e,#ff8f70)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Rubik,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
.hero{position:relative;background:linear-gradient(#0d3f3e,#082e2d);color:#eef6f4;overflow:hidden}
.hero>svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(110px,16vw,170px)}
.hero .t{position:relative;padding:clamp(18px,3vw,32px) max(5vw,16px) clamp(84px,12vw,130px);max-width:760px}
.hero .logo{display:block;height:clamp(68px,9vw,100px);width:auto;margin:0 0 14px}
.hero .course{font-size:15px;font-weight:700;color:var(--gold);margin:0 0 4px}
.hero h1{font-size:clamp(32px,4.6vw,46px);text-wrap:balance}
.hero p{margin:8px 0 0;font-size:16px;color:#cfe3df;max-width:44ch}
main{max-width:820px;margin:0 auto;padding:22px max(5vw,16px) 64px}
.trail{display:flex;gap:6px;margin:0 0 22px;flex-wrap:wrap}
.trail span{flex:1 1 60px;font-size:13px;color:var(--soft);border-top:5px solid var(--line);padding-top:6px}
.trail span.on{border-color:var(--accent);color:var(--ink);font-weight:700}
.trail span.done{border-color:var(--water)}
.kick{font-size:14px;font-weight:700;color:var(--accent)}
h2{font-size:clamp(26px,3.6vw,34px);margin:4px 0 10px}
.lead{font-size:17px;margin:0 0 18px;max-width:68ch}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:80px minmax(0,1fr);gap:4px 16px;padding:16px;border:2px solid var(--line);border-radius:14px;background:var(--panel)}
.watch{background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;padding:18px 20px;margin:0 0 22px}
.watch h3{font-size:21px;margin:0 0 6px}
.watch p{margin:0 0 12px}
.pass{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.pass code{font:700 17px ui-monospace,Menlo,monospace;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;margin:14px 0 0;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--water);flex:none}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 22px}
.info div{background:var(--panel);border-radius:12px;padding:14px 16px;font-size:15px}
.info b{display:block;font-size:16px;margin-bottom:2px}
.card:hover{border-color:var(--water)}
.card:focus-visible,.opt:focus-visible,.btn:focus-visible,.term:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card[aria-pressed=true],.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accentbg)}
.card svg{grid-row:span 3;width:80px;height:80px}
.card h3{font-size:19px}
.card .d{font-size:15px}
.card .e{font-size:14px;color:var(--soft)}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--panel);min-height:44px}
.opt:hover{border-color:var(--water)}
.opt b{display:block;font-size:17px}
.opt span{font-size:15px;color:var(--soft)}
.report{background:var(--deep);color:#eef6f4;border-radius:16px;padding:20px 22px;margin:0 0 18px;position:relative}
.report .k{color:var(--gold);font-weight:700;font-size:14px}
.report h3{font-size:22px;margin:4px 0 8px;color:#fff}
.report p{margin:0;font-size:17px;line-height:1.55}
.report .term{color:#ffe08a;border-color:#ffe08a}
.term{all:unset;cursor:pointer;border-bottom:2px dotted var(--water);font-weight:700}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 16px}
.ud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 16px}
.ud div{border-radius:14px;padding:16px 18px;background:var(--panel);border-left:6px solid var(--up)}
.ud div.dn{border-left-color:var(--dn)}
.ud b{display:block;margin-bottom:4px}
label{display:block;font-weight:700;margin:18px 0 6px}
label span{font-weight:400;color:var(--soft)}
textarea,input[type=text]{width:100%;font:16px/1.5 "Nunito Sans",sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:100px;resize:vertical}
input[type=text]{max-width:420px;min-height:44px}
textarea:focus,input:focus{outline:none;border-color:var(--water)}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.btn{font:700 16px "Nunito Sans",sans-serif;min-height:44px;padding:10px 20px;border-radius:999px;border:2px solid var(--water);background:var(--water);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.hint{font-size:14px;color:var(--soft)}
.sum{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 18px 12px;margin:16px 0}
.sum h3{font-size:17px;margin:14px 0 4px}
.sum p{margin:0;white-space:pre-wrap}
.paths{display:grid;gap:10px}
.paths div{padding:12px 16px;border-radius:12px;background:var(--panel)}
.ok{color:var(--accent);font-weight:700}
.sheet{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--deep);color:#eef6f4;border-radius:16px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9}
.sheet h3{color:var(--gold);font-size:18px;margin:0 0 6px}
.sheet p{margin:0 0 12px}
.sheet .btn{background:#eef6f4;color:#082e2d;border-color:#eef6f4;min-height:40px;padding:6px 16px}
@media(max-width:600px){.cards,.ud,.info{grid-template-columns:minmax(0,1fr)}.hero>svg{height:84px}.hero .t{padding-bottom:76px}.trail span{flex-basis:36px;font-size:0}.trail span.on{font-size:13px;flex-basis:100%}}
@media(prefers-reduced-motion:no-preference){.bob{animation:bob 5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(3px)}}#stage{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>

 {id:'species',name:'Species',d:'Focus on preventing extinction of the most threatened species.',e:'e.g., putting resources into a critically endangered species, like the Philippine crocodile, before it disappears.',ic:'<circle cx="28" cy="28" r="27" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><use href="#cr" x="5" y="18" width="46" height="16" style="color:var(--water)"/><path d="M8 40c4-2 8 2 12 0s8 2 12 0 8 2 12 0" stroke="#4fa39d" stroke-width="2" fill="none" stroke-linecap="round"/>'},

  <div class="ud"><div><b>What could go well</b>${tx(a.up)}</div><div class="dn"><b>What could go wrong</b>${tx(a.dn)}</div></div><p class="hint">Keep these in mind. You’ll come back to them.</p>${nav(true)}`;break;
 case 5:h=`<div class="kick">Step 5</div><h2>What the data can’t tell you</h2><p class="lead">Genomic data is powerful, but it has limits. Your team’s geneticist flags a concern.</p>
  <div class="report"><div class="k">Limitation</div><p>${tx(c.lim)}</p></div><label>Given this limitation, what should your team do?</label>${opts('lim',LIM)}${ta('info','What additional information would you want before implementing your plan?','','Before moving forward, I would want to know...')}${nav(true)}`;break;
 case 6:h=`<div class="kick">Step 6</div><h2>An unexpected complication</h2><p class="lead">Just as your team is about to move forward with <strong>${a.n}</strong>...</p>
  <div class="report"><div class="k">Breaking news</div><p>${SUR[S.sur]}</p></div><label>Does your plan still hold?</label>${opts('hold',HOLD)}${ta('exp','Explain your decision','How does this change, or not change, your thinking?','After this news, I...')}${nav(true)}`;break;
 case 7:{const ok=S.fin&&S.trade.trim();
  h=`<div class="kick">Step 7</div><h2>Your final recommendation</h2><p class="lead">After everything your team has learned, what should be the <strong>ultimate conservation priority</strong>? You may keep your original choice (<strong>${pn(S.pri)}</strong>) or change it.</p>${cards('fin')}
  ${ta('trade','What is one limitation or trade-off your organization needs to consider?','','Our organization has to accept that...')}
  <div class="sum" id="sum">${summary().map(([q,t])=>`<h3>${q}</h3><p>${esc(t)}</p>`).join('')}</div>
  <div class="nav"><button class="btn ghost" type="button" id="back">Back</button><a class="btn" id="submit" href="${ok?formLink():'#'}" target="_blank" rel="noopener" aria-disabled="${!ok}">Submit to instructor</a><button class="btn ghost" type="button" id="copy">Copy for discussion board</button><span class="ok" id="msg" role="status"></span></div>
  <p class="hint">“Submit to instructor” opens a Google Form with your answers filled in. Check them, then press <strong>Submit</strong> on the form.</p>
  <h2 style="font-size:26px;margin-top:34px">Other paths you could have taken</h2><p class="lead">Teams that started from the same evidence could have chosen very differently. Here’s how the other options might have played out.</p>
  <div class="paths">${c.a.map((o,i)=>i===S.act?'':`<div><b>${o.n}</b><br><span style="color:var(--up)">↑</span> ${tx(o.up)}<br><span style="color:var(--dn)">↓</span> ${tx(o.dn)}</div>`).join('')}</div>
  <div class="nav"><button class="btn ghost" type="button" id="again">Explore another path</button></div>`;}
 }
 const st=$('stage');st.innerHTML=h;st.style.animation='none';st.offsetHeight;st.style.animation='';
 upd();
}
function upd(){
 const n=$('next');if(n){n.disabled=!valid();$('need').textContent=valid()?'':S.step===0?'Confirm you watched the lecture and add your name to start.':'Make a choice and write a response to continue.'}
 if(S.step===7){const ok=!!(S.fin&&S.trade.trim()),b=$('submit');b.setAttribute('aria-disabled',String(!ok));b.href=ok?formLink():'#';
  $('sum').innerHTML=summary().map(([q,t])=>`<h3>${q}</h3><p>${esc(t)}</p>`).join('')}
}
const go=s=>{S.step=s;if(s===6&&S.sur<0)S.sur=rnd(SUR.length);save();render();scrollTo({top:0})};
const msg=t=>{const m=$('msg');if(m){m.textContent=t;setTimeout(()=>m.textContent='',2500)}};

$('stage').addEventListener('input',e=>{const k=e.target.dataset.s;if(k){S[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();upd()}});
$('stage').addEventListener('click',e=>{
 const t=e.target.closest('.term');if(t){const k=t.dataset.k;$('defT').textContent=t.textContent;$('defP').textContent=GL[k]||'';$('def').hidden=false;$('defX').focus();return}
 const p=e.target.closest('[data-pick]');
 if(p){const k=p.dataset.pick,v=p.dataset.v;
  if(k==='pri'){if(S.pri!==v){S.pri=v;S.sc=rnd(SC[v].length);S.act=-1}}
  else if(k==='fin')S.fin=v;else S[k]=+v;
  save();const y=scrollY;render();scrollTo({top:y});return}
 const id=e.target.id;
 if(id==='next'&&valid())go(S.step+1);
 else if(id==='back')go(S.step-1);
 else if(id==='again'){const n=S.name;S=blank();S.name=n;go(1)}
 else if(id==='submit'&&e.target.getAttribute('aria-disabled')==='true'){e.preventDefault();msg(S.fin?'Add a trade-off first':'Choose a final priority first')}
 else if(id==='cpass'){try{navigator.clipboard.writeText('V2Y%wK4C').then(()=>msg('Copied!'),()=>msg('Copy failed. Select the passcode instead.'))}catch(err){msg('Copy failed. Select the passcode instead.')}}
 else if(id==='copy'){const t=`${S.name}\n\n`+summary().map(([q,x])=>q+'\n'+x).join('\n\n');
  try{navigator.clipboard.writeText(t).then(()=>msg('Copied!'),()=>msg('Copy failed. Select the summary and copy it.'))}catch(err){msg('Copy failed. Select the summary and copy it.')}}
});
$('defX').addEventListener('click',()=>{$('def').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('def').hidden=true});
if(S.step>0&&!sc())S.step=1;
if(S.step>3&&!act())S.step=3;
render();
}
</script>
</body>
</html>
